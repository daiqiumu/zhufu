<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#150b14">
<title>周欣悦，对不起</title>
<style>
  *{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{height:100%;overflow:hidden;background:#150b14}
  body{
    font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif;
    color:#fff2f0;
  }
  #stage{position:fixed;inset:0;overflow:hidden;
    background:radial-gradient(120% 80% at 50% 0%,#3a1526 0%,#22101d 42%,#150b14 100%);
  }
  canvas{position:absolute;inset:0;width:100%;height:100%;display:block}
  #bg{z-index:1}
  #fx{z-index:4;pointer-events:none}
  #scenes{position:absolute;inset:0;z-index:3;display:flex;align-items:center;justify-content:center;pointer-events:none}
  .scene{
    position:absolute;inset:0;display:flex;flex-direction:column;
    align-items:center;justify-content:center;
    padding:0 26px;text-align:center;opacity:0;transition:opacity 1.1s ease;
  }
  .scene.on{opacity:1}
  .scene.out{opacity:0}

  .name{
    font-family:"Songti SC","Noto Serif SC",serif;
    font-size:44px;letter-spacing:.12em;color:#ffe9ec;
    text-shadow:0 0 26px rgba(255,120,150,.45);margin-bottom:22px;
    opacity:0;transform:translateY(14px);transition:all 1.2s ease;
  }
  .sorry{
    font-family:"Songti SC","Noto Serif SC",serif;
    font-size:52px;letter-spacing:.18em;color:#ffd0da;
    text-shadow:0 0 30px rgba(255,90,130,.55);
    opacity:0;transform:scale(.96);transition:all 1.4s ease .5s;
  }
  .sub{
    margin-top:28px;font-size:15px;letter-spacing:.14em;color:#d9a8b6;
    opacity:0;transition:opacity 1.4s ease 1.5s;
  }
  .scene.on .name{opacity:1;transform:translateY(0)}
  .scene.on .sorry{opacity:1;transform:scale(1)}
  .scene.on .sub{opacity:1}

  .line{
    font-size:17px;line-height:2.05;color:#f7dcdf;max-width:520px;
    margin:7px auto;letter-spacing:.04em;
    opacity:0;transform:translateY(10px);transition:all .9s ease;
  }
  .line.on{opacity:1;transform:translateY(0)}
  .line.soft{color:#cf9fae;font-size:15px}
  .line.big{
    font-family:"Songti SC","Noto Serif SC",serif;
    font-size:30px;letter-spacing:.14em;color:#ffd9e2;margin:22px 0;
  }
  .line.gap{margin-top:26px}
  #hint{
    position:absolute;left:0;right:0;bottom:46px;z-index:5;text-align:center;
    font-size:13px;letter-spacing:.2em;color:#c99aa8;opacity:0;transition:opacity 1.2s ease;
    pointer-events:none;
  }
  #hint.on{opacity:.85}
  #hint .dot{display:inline-block;width:6px;height:6px;border-radius:50%;background:#ff8fa8;
    margin:0 6px 2px;box-shadow:0 0 12px #ff6b8b;animation:pulse 1.8s infinite ease-in-out}
  @keyframes pulse{0%,100%{opacity:.35;transform:scale(.9)}50%{opacity:1;transform:scale(1.15)}}
</style>
</head>
<body>
<div id="stage">
  <canvas id="bg"></canvas>
  <div id="scenes"></div>
  <canvas id="fx"></canvas>
  <div id="hint"><span class="dot"></span>轻触屏幕，收下我的话<span class="dot"></span></div>
</div>

<script>
(function () {
  "use strict";

  var stage = document.getElementById("stage");
  var scenesBox = document.getElementById("scenes");
  var bg = document.getElementById("bg");
  var fx = document.getElementById("fx");
  var bgx = bg.getContext("2d");
  var fxx = fx.getContext("2d");

  var W = 0, H = 0, DPR = Math.min(window.devicePixelRatio || 1, 2);

  function resizeCanvas(c, ctx) {
    W = window.innerWidth; H = window.innerHeight;
    c.width = Math.floor(W * DPR); c.height = Math.floor(H * DPR);
    ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
  }
  function resizeAll() {
    resizeCanvas(bg, bgx);
    resizeCanvas(fx, fxx);
  }
  resizeAll();
  window.addEventListener("resize", resizeAll);

  /* ------------------------------ 文案 ------------------------------ */
  var SCRIPT = [
    {
      type: "title", ms: 5200,
      name: "周欣悦",
      sorry: "对不起"
    },
    {
      type: "lines", ms: 13500,
      lines: [
        "我知道，这次是我不好。",
        "说那些话的时候，我只顾着自己的情绪，",
        "忘了你也会难过，也忘了你一直很努力地在体谅我。",
        "这几天我反复在想，如果当时能先停三秒，",
        "先想一步你的感受，就不会让你受委屈。",
        "",
        "我不找借口，也不急着要你原谅。",
        "只想认认真真地，跟你说一声：对不起。"
      ]
    },
    {
      type: "lines", ms: 10500,
      lines: [
        "如果你还愿意，我们和好吧。",
        "以后我少一点嘴硬，多一点“我错了”；",
        "你不开心的时候，我先抱抱你，再讲道理。"
      ],
      big: "好不好？"
    },
    {
      type: "lines", ms: 12500,
      lines: [
        "还有，不管怎么样，都想看着你笑。",
        "愿你天天开心，",
        "愿你每天醒来，都比昨天多一点甜；",
        "愿以后的日子，风是温柔的，你也是。"
      ],
      big: "等我一下，我马上就来哄你。"
    }
  ];

  var scenes = [];
  SCRIPT.forEach(function (conf, i) {
    var el = document.createElement("div");
    el.className = "scene";
    if (conf.type === "title") {
      el.innerHTML =
        '<div class="name">' + conf.name + '</div>' +
        '<div class="sorry">' + conf.sorry + '</div>' +
        '<div class="sub">这句话，我想认真说给你听</div>';
    } else {
      var html = "";
      conf.lines.forEach(function (t) {
        html += t === "" ? '<div class="line soft"></div>' : '<div class="line">' + t + "</div>";
      });
      if (conf.big) html += '<div class="line big">' + conf.big + "</div>";
      el.innerHTML = html;
    }
    scenesBox.appendChild(el);
    scenes.push(el);
  });

  var current = -1;

  function showScene(i) {
    if (i >= scenes.length) return;
    if (current >= 0 && scenes[current]) {
      scenes[current].classList.remove("on");
      scenes[current].classList.add("out");
    }
    var el = scenes[i];
    el.classList.remove("out");
    el.classList.add("on");
    current = i;

    var lines = el.querySelectorAll(".line");
    for (var k = 0; k < lines.length; k++) {
      (function (node, idx) {
        setTimeout(function () { node.classList.add("on"); }, 320 + idx * 780);
      })(lines[k], k);
    }

    if (i === scenes.length - 1) {
      setTimeout(function () {
        document.getElementById("hint").classList.add("on");
        celebrate();
      }, 1200);
    }
    setTimeout(function () { showScene(i + 1); }, SCRIPT[i].ms);
  }

  /* ------------------------------ 爱心 ------------------------------ */
  var hearts = [];
  function heartShape(ctx, x, y, s, angle, color, alpha) {
    ctx.save();
    ctx.translate(x, y);
    ctx.rotate(angle);
    ctx.scale(s, s);
    ctx.beginPath();
    ctx.moveTo(0, 3);
    ctx.bezierCurveTo(0, 0.6, -3.2, -1.2, -4.6, 1.2);
    ctx.bezierCurveTo(-6, 3.6, -3.4, 6.6, 0, 9);
    ctx.bezierCurveTo(3.4, 6.6, 6, 3.6, 4.6, 1.2);
    ctx.bezierCurveTo(3.2, -1.2, 0, 0.6, 0, 3);
    ctx.closePath();
    ctx.globalAlpha = alpha;
    ctx.fillStyle = color;
    ctx.fill();
    ctx.restore();
  }

  function spawnHeart(x, y, opts) {
    opts = opts || {};
    hearts.push({
      x: x, y: y,
      vx: (Math.random() - 0.5) * (opts.spread || 40),
      vy: -(30 + Math.random() * 55),
      size: opts.size || (5 + Math.random() * 7),
      rot: (Math.random() - 0.5) * 0.7,
      vr: (Math.random() - 0.5) * 0.9,
      alpha: 1,
      decay: 0.0042 + Math.random() * 0.004,
      hue: opts.hue !== undefined ? opts.hue : (335 + Math.random() * 25)
    });
  }

  function tapBurst(x, y) {
    for (var i = 0; i < 7; i++) spawnHeart(x + (Math.random() - 0.5) * 18, y + (Math.random() - 0.5) * 12, { spread: 120 });
    firework(x, y);
  }

  /* ------------------------------ 烟花 ------------------------------ */
  var parts = [];
  var palette = [
    [255, 143, 168], [255, 196, 214], [255, 226, 173],
    [255, 120, 150], [255, 255, 255], [246, 168, 255]
  ];

  function firework(x, y) {
    var c = palette[Math.floor(Math.random() * palette.length)];
    var n = 26 + Math.floor(Math.random() * 14);
    for (var i = 0; i < n; i++) {
      var a = (Math.PI * 2 * i) / n + Math.random() * 0.2;
      var sp = 1.6 + Math.random() * 2.6;
      parts.push({
        x: x, y: y,
        vx: Math.cos(a) * sp, vy: Math.sin(a) * sp,
        life: 1, decay: 0.011 + Math.random() * 0.008,
        r: 1.1 + Math.random() * 1.6,
        col: c
      });
    }
  }

  function celebrate() {
    for (var i = 0; i < 3; i++) {
      (function (k) {
        setTimeout(function () {
          firework(W * (0.25 + Math.random() * 0.5), H * (0.2 + Math.random() * 0.25));
        }, k * 420);
      })(i);
    }
  }

  /* ------------------------------ 背景氛围 ------------------------------ */
  var crumbs = [];
  for (var i = 0; i < 26; i++) {
    crumbs.push({
      x: Math.random(), y: Math.random(),
      r: 0.7 + Math.random() * 1.6,
      sp: 0.00006 + Math.random() * 0.00016,
      ph: Math.random() * Math.PI * 2,
      hue: 330 + Math.random() * 30
    });
  }

  var last = performance.now();
  function frame(now) {
    var dt = Math.min((now - last) / 16.667, 3);
    last = now;

    bgx.clearRect(0, 0, W, H);
    for (var i = 0; i < crumbs.length; i++) {
      var c = crumbs[i];
      c.y -= c.sp * dt * 60;
      if (c.y < -0.05) { c.y = 1.05; c.x = Math.random(); }
      var sway = Math.sin(now / 1600 + c.ph) * 8;
      bgx.globalAlpha = 0.18 + 0.22 * (0.5 + 0.5 * Math.sin(now / 900 + c.ph));
      bgx.fillStyle = "hsl(" + c.hue + ",80%,78%)";
      bgx.beginPath();
      bgx.arc(c.x * W + sway, c.y * H, c.r, 0, Math.PI * 2);
      bgx.fill();
    }
    bgx.globalAlpha = 1;

    fxx.clearRect(0, 0, W, H);

    for (var h = hearts.length - 1; h >= 0; h--) {
      var p = hearts[h];
      p.x += p.vx * dt * 0.06;
      p.y += p.vy * dt * 0.06;
      p.vy += 0.012 * dt;
      p.vx *= 0.995;
      p.rot += p.vr * 0.02 * dt;
      p.alpha -= p.decay * dt;
      if (p.alpha <= 0 || p.y < -60) { hearts.splice(h, 1); continue; }
      heartShape(fxx, p.x, p.y, p.size * 0.55, p.rot,
        "hsla(" + p.hue + ",85%,72%,1)", Math.max(p.alpha, 0));
    }

    for (var q = parts.length - 1; q >= 0; q--) {
      var s = parts[q];
      s.x += s.vx * dt;
      s.y += s.vy * dt;
      s.vx *= 0.975;
      s.vy = s.vy * 0.975 + 0.045 * dt;
      s.life -= s.decay * dt;
      if (s.life <= 0) { parts.splice(q, 1); continue; }
      fxx.globalAlpha = Math.max(s.life, 0);
      fxx.fillStyle = "rgb(" + s.col[0] + "," + s.col[1] + "," + s.col[2] + ")";
      fxx.beginPath();
      fxx.arc(s.x, s.y, s.r * (0.6 + s.life * 0.6), 0, Math.PI * 2);
      fxx.fill();
    }
    fxx.globalAlpha = 1;

    requestAnimationFrame(frame);
  }
  requestAnimationFrame(frame);

  /* ------------------------------ 交互 ------------------------------ */
  function onTap(x, y) { tapBurst(x, y); }

  var usedTouch = false;
  document.addEventListener("touchstart", function (e) {
    usedTouch = true;
    if (e.touches && e.touches[0]) onTap(e.touches[0].clientX, e.touches[0].clientY);
  }, { passive: true });
  document.addEventListener("click", function (e) {
    if (usedTouch) return;
    onTap(e.clientX, e.clientY);
  });
  document.addEventListener("keydown", function (e) {
    if (e.key === " " || e.key === "Enter") onTap(W / 2, H / 2);
  });

  /* ------------------------------ 开演 ------------------------------ */
  setTimeout(function () { showScene(0); }, 420);
})();
</script>
</body>
</html>
